name: lugo-bench

services:
  server:
    image: lugobots/server:latest
    command: >
      play
      --dev-mode
      --timer-mode=rush
      --record-path=/recordings/dummies_vs_dummies.json
      --headless
      --quiet
    ports:
      - "5000:5000"
      - "8080:8080"
    volumes:
      - ./recordings:/recordings
    networks: [lugo]

  home_01:
    image: lugobots/the-dummies-go:latest
    depends_on: [server]
    environment:
      - BOT_TEAM=home
      - BOT_NUMBER=1
      - BOT_GRPC_URL=server:5000
    restart: on-failure
    networks: [lugo]

  home_02:
